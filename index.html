<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181B">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gest</title>
<style>
:root{
  --bg:#2B2B2B; --panel:#18181B; --card:#262121; --card-hover:#2e2828; --folder:#27272A; --line:#3F3F46;
  --text:#E4E4E7; --text-strong:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --blue:#1f538d; --blue-hi:#60A5FA; --green:#34D399; --green-bg:#064E3B; --btn-green:#27AE60;
  --red:#F87171; --red-bg:#450A0A; --btn-minus:#8d1f1f; --amber:#FBBF24; --purple:#C084FC; --teal:#0D9488;
  --radius:12px; --gutter:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
.app{width:100%;max-width:720px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
[hidden]{display:none!important}

/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--panel);padding:10px var(--gutter) 10px;border-bottom:1px solid #000;display:grid;gap:10px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:19px;color:var(--text-strong);letter-spacing:.2px;flex:1;min-width:0}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--text)}
.icon-btn:active{background:#333}
.search{position:relative}
.search input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:#222226;color:var(--text);padding:0 40px 0 14px;font:inherit}
.search input::placeholder{color:#8a8a92}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.search .clear{position:absolute;right:2px;top:0;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}

/* conteúdo */
main{flex:1;padding:12px var(--gutter) calc(88px + var(--safe-b));display:grid;gap:8px;align-content:start}
.crumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;align-items:center}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex:none;padding:6px 11px;border-radius:999px;background:#333338;color:var(--text);font-size:13.5px;white-space:nowrap}
.crumb.cur{background:var(--blue);color:#fff;font-weight:600}
.sep{color:var(--dim);flex:none}
.card{background:var(--card);border-radius:var(--radius);padding:12px 12px 12px 14px}
.folder{background:var(--folder);display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px}
.folder:active{background:#34343a}
.folder .f-name{flex:1;min-width:0;color:var(--blue-hi);font-weight:650;overflow-wrap:anywhere}
.folder .f-meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.folder svg{flex:none;color:var(--dim)}
.piece{display:flex;align-items:center;gap:10px}
.piece.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:#0F766E}100%{background:var(--card)}}
.p-info{flex:1;min-width:0;display:grid;gap:5px;justify-items:start}
.p-name{font-weight:650;color:#F4F4F5;text-align:left;overflow-wrap:anywhere;line-height:1.25}
.p-path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.chip{display:inline-block;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px}
.ctrl{display:flex;align-items:center;gap:6px;flex:none}
.ctrl button{width:44px;height:44px;border-radius:10px;font-size:22px;font-weight:700;color:#fff;display:grid;place-items:center}
.ctrl .minus{background:var(--btn-minus)} .ctrl .plus{background:var(--blue)}
.ctrl .minus:active{background:#AD2424} .ctrl .plus:active{background:#246BAD}
.ctrl .qty{width:auto;min-width:54px;padding:0 8px;font-size:17px;background:var(--green-bg);color:var(--green)}
.ctrl .qty.zero{background:var(--red-bg);color:var(--red)}
.hint{color:var(--muted);font-size:13.5px;padding:2px 2px 6px}
.h2{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 2px 2px}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.welcome{background:var(--folder);border-radius:16px;padding:22px 18px;display:grid;gap:14px;margin-top:6px}
.welcome h1{margin:0;font-size:21px;color:var(--text-strong)}
.welcome p{margin:0;color:var(--text);font-size:15px}
.welcome ol{margin:0;padding-left:20px;color:var(--text);font-size:15px;display:grid;gap:4px}

.btn{min-height:48px;border-radius:10px;padding:0 16px;font-weight:650;color:#fff;background:var(--blue);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{filter:brightness(1.15)}
.btn.green{background:var(--btn-green)} .btn.gray{background:#52525B} .btn.red{background:var(--btn-minus)} .btn.teal{background:var(--teal)}
.btn[disabled]{background:#1F1F23;color:var(--dim);cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1 1 150px}

/* lotes e kits */
.chips{display:flex;flex-wrap:wrap;gap:5px}
button.chip{cursor:pointer}
.chip.lot{background:none;border:1px solid var(--teal);color:#5EEAD4;font-weight:600}
.chip.kit{background:none;border:1px solid #7C3AED;color:#C4B5FD;font-weight:600}
.kitc{display:grid;gap:4px;width:100%;text-align:left;background:var(--folder);min-height:56px}
.kitc .l1{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kitc .nm{font-weight:650;color:var(--blue-hi);overflow-wrap:anywhere}
.kitc .meta{font-size:12.5px;color:var(--muted)}
.st{font-size:12.5px;font-weight:700;white-space:nowrap}.st.ok{color:var(--green)}.st.bad{color:var(--red)}.st.warn{color:var(--amber)}
.comp{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #3a3a40}
.comp .q{min-width:40px;font-weight:700;color:var(--amber);white-space:nowrap}
.comp .tx{flex:1;min-width:0;display:grid;gap:2px;text-align:left}
.comp .tx .nm{font-weight:600;overflow-wrap:anywhere}
.comp .tx small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.comp .have{font-size:12.5px;font-weight:700;white-space:nowrap}
.sel{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:#18181B;color:var(--text);padding:0 10px;font:inherit}
.field.sm{height:48px;font:16px system-ui;text-align:left}
.lbl{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.xrow{display:grid;gap:6px;padding:9px 0;border-top:1px solid #3a3a40}
.xrow:first-child{border-top:0}
.opt{width:100%;min-height:52px;border-radius:10px;background:#2e2e33;padding:8px 14px;text-align:left;display:grid;gap:1px;font-weight:650}
.opt small{color:var(--muted);font-weight:400;font-size:12.5px}
.opt:active{background:#3F3F46}
.panel{background:var(--folder);border-radius:var(--radius);padding:4px 14px}
.lotline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #3a3a40}
.lotline:first-child,.comp:first-child{border-top:0}

/* resumo */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border-radius:var(--radius);padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.15}
.stat span{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.bar{height:6px;border-radius:3px;background:#3a3a40;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue-hi);border-radius:3px}
.mf{display:grid;gap:2px;width:100%;text-align:left}
.mf .top-line{display:flex;justify-content:space-between;gap:10px}
.mf .nm{font-weight:650;color:var(--blue-hi)}.mf .un{color:var(--amber);font-weight:700;white-space:nowrap}

/* alterações */
.chg{display:grid;gap:4px}
.chg .l1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chg .nm{font-weight:650;overflow-wrap:anywhere}
.chg .tm{font-size:12px;color:var(--muted);white-space:nowrap}
.chg .dt{font-size:13px;color:var(--muted)}
.chg .note{font-size:13px;color:var(--amber);font-style:italic}
.delta{font-weight:700;font-size:13px;padding:2px 9px;border-radius:6px;white-space:nowrap}
.delta.up{background:var(--green-bg);color:var(--green)}.delta.down{background:var(--red-bg);color:var(--red)}
.pill{background:var(--amber);color:#1c1917;font-weight:800;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px;position:absolute;top:4px;right:calc(50% - 22px)}

/* navegação inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid #000;display:flex;justify-content:center;padding-bottom:var(--safe-b)}
nav.tabs .in{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{height:62px;display:grid;justify-items:center;align-content:center;gap:2px;color:var(--dim);font-size:11px;font-weight:650;position:relative}
.tab[aria-current="page"]{color:var(--blue-hi)}
.tab:active{background:#222}

/* folhas (diálogos) */
#sheets{position:fixed;inset:0;z-index:50;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;background:#222226;border-radius:18px 18px 0 0;padding:18px var(--gutter) calc(18px + var(--safe-b));display:grid;gap:14px;max-height:92dvh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sheet h3{margin:0;font-size:18px;color:var(--text-strong);overflow-wrap:anywhere}
.sheet p{margin:0;color:var(--text);font-size:15px}
.sheet .sub{color:var(--muted);font-size:13.5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#18181B;border-radius:10px;padding:3px;gap:3px}
.seg button{height:42px;border-radius:8px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg button[aria-pressed="true"].m-sub{background:var(--btn-minus)}
.seg button[aria-pressed="true"].m-add{background:var(--blue)}
.seg button[aria-pressed="true"].m-set{background:#52525B}
.field{width:100%;height:56px;border-radius:10px;border:1px solid var(--line);background:#18181B;color:var(--text-strong);font:700 26px system-ui;padding:0 14px;text-align:center}
textarea.field{height:110px;padding:12px 14px;font:16px/1.4 system-ui;text-align:left;resize:vertical}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{height:44px;border-radius:10px;background:#3F3F46;font-weight:700}
.quick button:active{background:#52525B}
.preview{text-align:center;font-size:17px;color:var(--text)}
.preview b{color:var(--amber)}
.preview.warn{color:var(--amber);font-size:14px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border-radius:10px;padding:0 12px;text-align:left;font-weight:600}
.menu-item:active{background:#333}
.menu-item small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));z-index:60;background:#3F3F46;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.45);font-size:14.5px}
#toast button{color:var(--amber);font-weight:700;padding:6px 4px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Gest<small id="subtitle">Inventário</small></div>
      <button class="icon-btn" id="btn-menu" aria-label="Menu" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="search">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Pesquisa global..." aria-label="Pesquisa global">
      <button class="clear" id="q-clear" type="button" aria-label="Limpar pesquisa" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
  <nav class="tabs" aria-label="Secções"><div class="in" id="tabs"></div></nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status" hidden></div>
<input id="file" type="file" accept=".json,application/json" multiple hidden>

<script>
(function () {
'use strict';

/* ---------- constantes e estado ---------- */
const SEP = '::ID::';
const newId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const PALETTE = [
  {bg:'#0369A1',fg:'#E0F2FE'},{bg:'#6D28D9',fg:'#EDE9FE'},{bg:'#B45309',fg:'#FEF3C7'},{bg:'#047857',fg:'#D1FAE5'},
  {bg:'#BE185D',fg:'#FCE7F3'},{bg:'#4338CA',fg:'#E0E7FF'},{bg:'#0F766E',fg:'#CCFBF1'},{bg:'#9A3412',fg:'#FFEDD5'}
];
const K = {inv:'gkever.inv', base:'gkever.base', tags:'gkever.tags', log:'gkever.log', meta:'gkever.meta', lots:'gkever.lots', kits:'gkever.kits', baselots:'gkever.baselots', basekits:'gkever.basekits'};
let storageWarned = false;

function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { if (!storageWarned) { storageWarned = true; toast('Não foi possível guardar no telemóvel (armazenamento cheio ou bloqueado).'); } return false; }
}

const S = {
  inv: load(K.inv, null), base: load(K.base, null),
  tags: load(K.tags, {library: [], assignments: {}}),
  log: load(K.log, []), meta: load(K.meta, {importedAt: null, exportedLen: 0}),
  lots: load(K.lots, {}), kits: load(K.kits, {}), baseLots: load(K.baselots, null), baseKits: load(K.basekits, null),
  view: 'folders', path: [], kit: null, edit: null, tagFilter: null, query: '', highlight: null
};
const cloneLots = o => JSON.parse(JSON.stringify(o || {}));
if (!S.baseKits) { S.baseKits = cloneLots(S.kits); save(K.basekits, S.baseKits); }
if (!S.baseLots) { S.baseLots = cloneLots(S.lots); save(K.baselots, S.baseLots); }  // quem já importou na versão anterior
if (!S.tags || !Array.isArray(S.tags.library)) S.tags = {library: [], assignments: {}};
// alterações feitas antes desta versão não têm 'id': dão-se-lhes um, para não serem importadas duas vezes
if (Array.isArray(S.log) && S.log.some(e => e && !e.id)) { S.log.forEach(e => { if (e && !e.id) e.id = newId(); }); save(K.log, S.log); }

/* ---------- lotes e kits (mesmas regras do PC: app_lotes.py / app_kits.py) ---------- */
// JSON.parse reordena chaves que sejam números ("10" antes de "2"), o que estragaria o FIFO dos lotes:
// por isso a ordem dos lotes lê-se do texto e guarda-se como lista de pares [lote, qtd].
function parseOrdered(text) {
  let i = 0;
  const ws = () => { while (i < text.length && ' \t\n\r'.includes(text[i])) i++; };
  const str = () => { const a = i; i++; while (text[i] !== '"') { if (text[i] === '\\') i++; i++; } i++; return JSON.parse(text.slice(a, i)); };
  function val() {
    ws(); const c = text[i];
    if (c === '{') {
      i++; const out = {pairs: []}; ws();
      if (text[i] === '}') { i++; return out; }
      for (;;) { ws(); const k = str(); ws(); i++; out.pairs.push([k, val()]); ws(); if (text[i++] === '}') return out; }
    }
    if (c === '[') {
      i++; const out = []; ws();
      if (text[i] === ']') { i++; return out; }
      for (;;) { out.push(val()); ws(); if (text[i++] === ']') return out; }
    }
    if (c === '"') return str();
    const m = /^(-?\d+(\.\d+)?([eE][+-]?\d+)?|true|false|null)/.exec(text.slice(i, i + 40));
    i += m[0].length; return JSON.parse(m[0]);
  }
  return val();
}
function readLots(text, d) {
  let src = null;
  try { const p = parseOrdered(text).pairs.find(x => x[0] === 'lots'); if (p && p[1].pairs) src = p[1].pairs; } catch (e) { src = null; }
  if (!src) src = Object.entries(isFolder(d.lots) ? d.lots : {}).map(([k, v]) => [k, {pairs: isFolder(v) ? Object.entries(v) : []}]);
  const out = {};
  for (const [k, v] of src) {
    if (!v || !v.pairs) continue;
    const pairs = v.pairs.filter(([n, q]) => Number.isInteger(q) && q > 0);
    if (pairs.length) out[k] = pairs;
  }
  return out;
}
function readKits(d) {
  const out = {};
  if (!isFolder(d.kits)) return out;
  for (const [name, k] of Object.entries(d.kits)) {
    if (!k || !Array.isArray(k.componentes)) continue;
    out[name] = {componentes: k.componentes.filter(c => c && typeof c === 'object').map(c => {
      const q = parseInt(c.qtd, 10); const qtd = q > 0 ? q : 1;
      return c.tipo === 'kit' ? {tipo: 'kit', nome: String(c.nome || ''), qtd} : {tipo: 'peca', caminho: String(c.caminho || ''), qtd};
    })};
  }
  return out;
}
const kitNames = () => Object.keys(S.kits).sort(cmp);
function pieceExists(key) {
  const p = key.split('\n'), n = getNode(p.slice(0, -1));
  return isFolder(n) && p[p.length - 1] in n && !isFolder(n[p[p.length - 1]]);
}
function pieceQty(key) {
  if (!pieceExists(key)) return 0;
  const p = key.split('\n'); return Number(getNode(p.slice(0, -1))[p[p.length - 1]]) || 0;
}
// lotes da peça, sempre coerentes com o total (se o total é menor, corta-se dos mais antigos)
function pieceLots(path) {
  const stored = S.lots[pkey(path)];
  if (!stored) return [];
  let excess = stored.reduce((a, x) => a + x[1], 0) - pieceQty(pkey(path));
  const out = [];
  for (let [n, q] of stored) {
    if (excess > 0) { const cut = Math.min(q, excess); q -= cut; excess -= cut; }
    if (q > 0) out.push([n, q]);
  }
  return out;
}
const lotsFree = (path, lots) => pieceQty(pkey(path)) - lots.reduce((a, x) => a + x[1], 0);
function lotChipTexts(path) {
  const lots = pieceLots(path);
  if (!lots.length) return [];
  if (lots.length === 1 && lotsFree(path, lots) === 0) return ['Lote ' + lots[0][0]];
  if (lots.length <= 2) return lots.map(([n, q]) => `${n} · ${q}`);
  return [lots.length + ' lotes'];
}
// peças que um kit leva, com os kits lá dentro já desdobrados: {req: Map(chave → qtd), problems}
function kitFlat(name, stack = []) {
  const req = new Map(), problems = [];
  const kit = S.kits[name];
  if (!kit || stack.includes(name)) return {req, problems: [`kit '${name}' em falta ou em ciclo`]};
  for (const c of kit.componentes) {
    const q = c.qtd || 1;
    if (c.tipo === 'kit') {
      const sub = kitFlat(c.nome, stack.concat(name));
      problems.push(...sub.problems);
      for (const [k, v] of sub.req) req.set(k, (req.get(k) || 0) + v * q);
    } else req.set(c.caminho, (req.get(c.caminho) || 0) + q);
  }
  return {req, problems};
}
function kitStatus(name, n = 1) {
  const {req, problems} = kitFlat(name);
  let can = null; const falta = [];
  for (const [k, need1] of req) {

/* ---------- importar / exportar ---------- */
function detect(d) {
  if (d && Array.isArray(d.entries)) return 'hist';
  if (d && Array.isArray(d.library) && isFolder(d.assignments)) return 'tags';
  if (validInv(d)) return 'inv';
  return null;
}
async function importFiles(files) {
  let inv = null, tags = null, tagsText = '', invName = '';
  const problems = [];
  for (const f of files) {
    try {
      const text = await f.text();
      const d = JSON.parse(text);
      const kind = detect(d);
      if (kind === 'inv') { inv = d; invName = f.name; }
      else if (kind === 'tags') { tags = d; tagsText = text; }
      else if (kind === 'hist') problems.push(`${f.name}: é um ficheiro de histórico, não de inventário.`);
      else problems.push(`${f.name}: não parece ser um inventario.json nem um tags.json.`);
    } catch (e) { problems.push(`${f.name}: não é um ficheiro JSON válido.`); }
  }
  if (!inv && !tags) {
    openSheet([h('h3', null, 'Nada importado'), h('p', null, problems.join(' ') || 'Escolha o inventario.json e o tags.json.'),
      h('button', {class: 'btn gray block', type: 'button', onclick: e => e.target.closest('.backdrop').remove()}, 'Fechar')]);
    return;
  }
  if (inv && pending() > 0) {
    const ok = await ask({title: 'Substituir o inventário?', danger: true, ok: 'Importar e descartar',
      text: `Tem ${pending()} alteração(ões) de quantidade que ainda não exportou. Se importar agora, perdem-se.`});
    if (!ok) return;
  }
  if (inv) {
    S.inv = inv; S.base = JSON.parse(JSON.stringify(inv)); S.log = []; S.lots = cloneLots(S.baseLots); S.kits = cloneLots(S.baseKits); kitIdx = null; S.edit = null; save(K.lots, S.lots); save(K.kits, S.kits);
    S.meta = {importedAt: new Date().toISOString(), exportedLen: 0, file: invName};
    S.path = []; S.tagFilter = null; lastChange = null;
    save(K.inv, S.inv); save(K.base, S.base); save(K.log, S.log); save(K.meta, S.meta);
  }
  if (tags && !inv && pending() > 0) {
    const ok = await ask({title: 'Substituir lotes e kits?', danger: true, ok: 'Importar',
      text: `Tem ${pending()} alteração(ões) por exportar. Os lotes do ficheiro novo não incluem as saídas já feitas aqui, por isso os lotes mostrados deixam de bater certo. Exporte primeiro.`});
    if (!ok) tags = null;
  }
  if (tags) {
    S.tags = {library: tags.library.filter(t => typeof t === 'string'), assignments: tags.assignments};
    S.lots = readLots(tagsText, tags); S.baseLots = cloneLots(S.lots); S.kits = readKits(tags); S.baseKits = cloneLots(S.kits); kitIdx = null; S.kit = null; S.edit = null;
    save(K.tags, S.tags); save(K.lots, S.lots); save(K.baselots, S.baseLots); save(K.kits, S.kits); save(K.basekits, S.baseKits);
  }
  const parts = [];
  if (inv) parts.push(`inventário (${stats(S.inv).pieces} peças)`);
  if (tags) parts.push(`tags (${S.tags.library.length}), kits (${kitNames().length}), peças com lotes (${Object.keys(S.lots).length})`);
  toast('Importado: ' + parts.join(' e ') + (problems.length ? '. Ignorados: ' + problems.length : '.'));
  render();
}
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
  const a = h('a', {href: url, download: name});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function compRows(name, mult, depth, stack) {

  for (const c of S.kits[name].componentes) {
    const q = (c.qtd || 1) * mult;
    if (c.tipo === 'kit') {
      const ok = S.kits[c.nome] && !stack.includes(c.nome) && c.nome !== name;
      out.push(h('div', {class: 'comp', style: pad}, h('div', {class: 'q'}, q + '×'),
        h('div', {class: 'tx'}, h('span', {class: 'nm', style: 'color:var(--purple)'}, 'Kit · ' + c.nome), ok ? null : h('small', {style: 'color:var(--red)'}, 'kit em falta ou em círculo'))));
      if (ok) out.push(...compRows(c.nome, q, depth + 1, stack.concat(name)));
    } else {
      const ex = pieceExists(c.caminho), have = pieceQty(c.caminho), good = ex && have >= q;
      const parts = c.caminho.split('\n');
      out.push(h('div', {class: 'comp', style: pad}, h('div', {class: 'q'}, q + '×'),
        h('div', {class: 'tx'},

             : h('span', {class: 'nm', style: 'color:var(--red)'}, display(parts[parts.length - 1]) + '  (já não existe)'),
          h('small', null, parts.slice(0, -1).join(' › ') || 'Raiz')),
        h('div', {class: 'have', style: `color:var(--${good ? 'green' : 'red'})`}, ex ? 'tem ' + have : '—')));
    }
  }
  return out;
}

function commitRecipe(old, name, comps) {
  const before = cloneLots(S.kits);
  const antes = old ? cloneLots(S.kits[old]) : null;
  const depois = {componentes: comps.map(c => c.tipo === 'kit' ? {tipo: 'kit', nome: c.nome, qtd: c.qtd} : {tipo: 'peca', caminho: c.caminho, qtd: c.qtd})};
  if (old && old === name && JSON.stringify(antes) === JSON.stringify(depois)) { S.edit = null; toast('Sem alterações na receita.'); render(); return; }
  if (old && old !== name) {
    S.kits[name] = S.kits[old]; delete S.kits[old];
    for (const k of Object.values(S.kits)) for (const c of k.componentes) if (c.tipo === 'kit' && c.nome === old) c.nome = name;  // outros kits que o levavam
  }
  S.kits[name] = depois;
  const entry = {ts: nowStr(), tipo: 'receita', alvo: 'kit', item: name, caminho: '', antes: null, depois: null,
                 detalhe: !old ? 'kit criado' : old !== name ? `kit renomeado de «${old}» e receita editada` : 'receita editada',
                 nota: '', origem: 'telemovel', id: newId(),
                 receita: {acao: old ? 'editar' : 'criar', nome_antigo: old && old !== name ? old : undefined, antes, depois}};
  recipeLog(entry, before);
  S.edit = null; S.kit = name;
  toast(old ? 'Receita guardada.' : `Kit «${name}» criado.`, {label: 'Desfazer', fn: undo});
  render(); window.scrollTo(0, 0);
}

function saveEdit() {
  const E = S.edit, name = E.name.trim();
  if (!name) return toast('Dê um nome ao kit.');
  if (kitNames().some(k => k.toLowerCase() === name.toLowerCase() && k !== E.old)) return toast(`Já existe um kit chamado «${name}».`);
  if (!E.comps.length) return toast('Junte pelo menos um componente à receita.');
  if (E.comps.some(c => !(Number.isInteger(c.qtd) && c.qtd > 0))) return toast('As quantidades têm de ser números inteiros maiores que 0.');
  const ref = E.old || name;
  for (const c of E.comps) if (c.tipo === 'kit' && (c.nome === ref || kitContains(c.nome, ref))) return toast(`O kit «${c.nome}» leva este kit (ou é ele próprio): daria uma receita em círculo.`);
  commitRecipe(E.old, name, E.comps);
}

  const keyOf = c => c.tipo === 'kit' ? c.nome : c.caminho;
  function renderComps() {
    if (!E.comps.length) { compsBox.replaceChildren(h('div', {class: 'hint', style: 'padding:12px 0'}, 'Ainda sem componentes. Escolha peças ou kits na lista de baixo.')); return; }
    compsBox.replaceChildren(...E.comps.map((c, i) => {
      const parts = c.tipo === 'kit' ? [] : c.caminho.split('\n');
      const ex = c.tipo === 'kit' ? !!S.kits[c.nome] : pieceExists(c.caminho);
      const inp = h('input', {class: 'field', type: 'text', inputmode: 'numeric', pattern: '[0-9]*', value: String(c.qtd), 'aria-label': 'Quantidade',
        style: 'width:64px;height:44px;font-size:18px;padding:0 4px'});
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 5); c.qtd = parseInt(inp.value, 10) || 0; });
      inp.addEventListener('blur', () => { if (!(c.qtd > 0)) { c.qtd = 1; inp.value = '1'; } });
      const step = d => () => { c.qtd = Math.max(1, (c.qtd || 0) + d); inp.value = String(c.qtd); };
      return h('div', {class: 'xrow'},
        h('div', {class: 'comp', style: 'border:0;padding:0'},
          h('div', {class: 'tx'},
            h('span', {class: 'nm', style: `color:${c.tipo === 'kit' ? 'var(--purple)' : ex ? 'var(--text-strong)' : 'var(--red)'}`}, c.tipo === 'kit' ? 'Kit · ' + c.nome + (ex ? '' : '  (em falta)') : display(parts[parts.length - 1]) + (ex ? '' : '  (já não existe)')),
            c.tipo === 'kit' ? null : h('small', null, parts.slice(0, -1).join(' › ') || 'Raiz')),
          h('button', {class: 'icon-btn', type: 'button', 'aria-label': 'Tirar da receita', style: 'width:40px;height:40px;color:var(--red)', onclick: () => { E.comps.splice(i, 1); renderComps(); renderResults(); }}, svg('<path d="M6 6l12 12M18 6L6 18"/>', 20))),
        h('div', {class: 'ctrl', style: 'justify-content:flex-end'},
          h('button', {class: 'minus', type: 'button', 'aria-label': 'Menos', onclick: step(-1)}, '−'), inp,
          h('button', {class: 'plus', type: 'button', 'aria-label': 'Mais', onclick: step(1)}, '+')));
    }));
  }
  function candidates() {
    const toks = queryTokens(E.q);
    if (E.mode === 'kit') {
      return kitNames().filter(n => n !== E.old && !(E.old && kitContains(n, E.old)))
        .filter(n => { const hs = haystack(n + ' ' + S.kits[n].componentes.map(c => c.tipo === 'kit' ? c.nome : display(c.caminho.split('\n').pop())).join(' ')); return toks.every(t => hs.includes(t)); })
        .map(n => ({tipo: 'kit', nome: n, title: n, sub: `${S.kits[n].componentes.length} componente(s)`}));
    }
    return allPieces().filter(p => { const hs = haystack(p.path.map(display).join(' ') + ' ' + (tagOf(p.path) || '')); return toks.every(t => hs.includes(t)); })
      .sort((a, b) => cmp(display(a.key), display(b.key)))
      .map(p => ({tipo: 'peca', caminho: pkey(p.path), title: display(p.key), sub: p.path.slice(0, -1).join(' › ') || 'Raiz'}));
  }
  function add(cand) {
    const have = E.comps.find(c => c.tipo === cand.tipo && keyOf(c) === keyOf(cand));
    if (have) have.qtd = (have.qtd || 0) + 1;
    else E.comps.push(cand.tipo === 'kit' ? {tipo: 'kit', nome: cand.nome, qtd: 1} : {tipo: 'peca', caminho: cand.caminho, qtd: 1});
    renderComps(); renderResults();
    compsBox.scrollTop = compsBox.scrollHeight;
  }
  function renderResults() {
    const res = candidates();
    if (!res.length) { resBox.replaceChildren(h('div', {class: 'hint', style: 'padding:12px 0'}, E.q.trim() ? 'Nada encontrado.' : (E.mode === 'kit' ? 'Ainda não há outros kits.' : 'Não há peças.'))); resInfo.textContent = ''; return; }
    resBox.replaceChildren(...res.slice(0, 40).map(cand => {
      const inR = E.comps.find(c => c.tipo === cand.tipo && keyOf(c) === keyOf(cand));
      return h('button', {class: 'comp', type: 'button', style: 'width:100%;text-align:left', onclick: () => add(cand)},
        h('div', {class: 'tx'}, h('span', {class: 'nm', style: cand.tipo === 'kit' ? 'color:var(--purple)' : ''}, cand.title), h('small', null, cand.sub)),
        h('div', {class: 'have', style: `color:var(--${inR ? 'green' : 'blue-hi'});font-size:15px`}, inR ? `✓ ×${inR.qtd}` : '+'));
    }));
    resInfo.textContent = `${res.length} resultado(s)` + (res.length > 40 ? ' · a mostrar 40, afine a pesquisa' : '');
  }
  const nameInp = h('input', {class: 'field sm', type: 'text', autocomplete: 'off', maxlength: 60, placeholder: 'Nome do kit (ex.: Kit V-tail)', 'aria-label': 'Nome do kit', value: E.name});
  nameInp.addEventListener('input', () => { E.name = nameInp.value; });
  const qInp = h('input', {class: 'field sm', type: 'search', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: E.mode === 'kit' ? 'Pesquisar kits...' : 'Pesquisar peças...', 'aria-label': 'Pesquisar para juntar', value: E.q});
  let qTimer2 = null;
  qInp.addEventListener('input', () => { E.q = qInp.value; clearTimeout(qTimer2); qTimer2 = setTimeout(renderResults, 120); });
  const segB = {};
  const setMode = m => { E.mode = m; for (const k of Object.keys(segB)) segB[k].setAttribute('aria-pressed', String(k === m)); qInp.placeholder = m === 'kit' ? 'Pesquisar kits...' : 'Pesquisar peças...'; renderResults(); };
  const seg = h('div', {class: 'seg', style: 'grid-template-columns:repeat(2,1fr)', role: 'group', 'aria-label': 'Juntar'},
    ...[['peca', 'Peças'], ['kit', 'Kits']].map(([k, label]) => (segB[k] = h('button', {type: 'button', class: 'm-set', onclick: () => setMode(k)}, label))));
  for (const k of Object.keys(segB)) segB[k].setAttribute('aria-pressed', String(k === E.mode));
  renderComps(); renderResults();
  main.replaceChildren(
    h('div', {class: 'lbl', style: 'margin-top:4px'}, E.old ? 'Editar receita' : 'Novo kit'),
    nameInp,
    h('div', {class: 'h2'}, 'Na receita'), compsBox,
    h('div', {class: 'h2'}, 'Juntar (toque para adicionar)'), seg, qInp, resBox, resInfo,
    h('div', {class: 'row'},
      h('button', {class: 'btn gray', type: 'button', onclick: async () => { if (await leaveEdit()) { render(); window.scrollTo(0, 0); } }}, 'Cancelar'),
      h('button', {class: 'btn green', type: 'button', onclick: saveEdit}, 'Guardar')));
}

function viewKits() {
  const names = kitNames();
  if (S.edit) { viewKitEditor(); return; }
  if (S.kit && !S.kits[S.kit]) S.kit = null;
  if (S.kit) {
    const name = S.kit, st = kitStatusInfo(name), s = st.s;
    const els = [
      h('div', {class: 'row', style: 'align-items:center;justify-content:space-between;flex-wrap:nowrap'},
        h('button', {class: 'crumb', type: 'button', onclick: () => { S.kit = null; render(); window.scrollTo(0, 0); }}, '‹ Todos os kits'),
        h('span', {class: 'st ' + st.cls}, st.txt)),
      h('h2', {style: 'margin:6px 2px 0;font-size:20px;color:var(--text-strong);overflow-wrap:anywhere'}, name)];
    if (s.problems.length) els.push(h('div', {class: 'hint', style: 'color:var(--amber)'}, [...new Set(s.problems)].join(' · ')));
    else if (s.falta.length) els.push(h('div', {class: 'hint', style: 'color:var(--red)'}, 'Para 1 kit falta: ' + s.falta.map(f => `${f.nome} (tem ${f.tem}, precisa de ${f.precisa})`).join('; ')));
    els.push(h('button', {class: 'btn green block', type: 'button', onclick: () => openKitExit(name)}, 'Dar saída de kits'));
    els.push(h('div', {class: 'row'},
      h('button', {class: 'btn gray', type: 'button', onclick: () => startEdit(name)}, 'Editar receita'),
      h('button', {class: 'btn red', type: 'button', onclick: () => deleteKit(name)}, 'Apagar kit')));
    els.push(h('div', {class: 'h2'}, 'Receita'));
    els.push(S.kits[name].componentes.length ? h('div', {class: 'panel'}, ...compRows(name, 1, 0, [])) : h('div', {class: 'hint'}, 'A receita está vazia.'));
    main.replaceChildren(...els);
    return;
  }
  const novo = h('button', {class: 'btn teal block', type: 'button', onclick: () => startEdit(null)}, '+ Novo kit');
  if (!names.length) { main.replaceChildren(novo, h('div', {class: 'empty'}, 'Ainda não há kits. Crie um, ou importe o tags.json do PC.')); return; }
  main.replaceChildren(novo, h('div', {class: 'hint'}, 'Toque num kit para ver a receita.'),
    ...names.map(n => { const st = kitStatusInfo(n), c = S.kits[n].componentes.length;
      return h('button', {class: 'card kitc', type: 'button', onclick: () => { S.kit = n; render(); window.scrollTo(0, 0); }},
        h('div', {class: 'l1'}, h('span', {class: 'nm'}, n), svg(ICON.chev, 18)),
        h('div', {class: 'l1'}, h('span', {class: 'meta'}, `${c} componente${c === 1 ? '' : 's'}`), h('span', {class: 'st ' + st.cls}, st.txt))); }));
}

function viewSearch() {
  const toks = queryTokens(S.query);
  const fol = allFolders().filter(f => { const hs = haystack(f.path.join(' ')); return toks.every(t => hs.includes(t)); });
  const pcs = allPieces().filter(p => {
    const hs = haystack(p.path.map(display).join(' ') + ' ' + (tagOf(p.path) || '') + ' ' + pieceLots(p.path).map(x => 'Lote ' + x[0]).join(' ') + ' ' + kitsUsingPiece(pkey(p.path)).map(x => 'Kit ' + x[0]).join(' '));
    return toks.every(t => hs.includes(t));
  }).sort((a, b) => cmp(display(a.key), display(b.key)));
  const kts = kitNames().filter(n => { const hs = haystack(n + ' ' + S.kits[n].componentes.map(c => c.tipo === 'kit' ? c.nome : display(c.caminho.split('\n').pop())).join(' ')); return toks.every(t => hs.includes(t)); });
  const total = fol.length + pcs.length + kts.length;
  const els = [h('div', {class: 'hint'}, total ? `${pcs.length} peça${pcs.length === 1 ? '' : 's'}` + (fol.length ? ` e ${fol.length} pasta${fol.length === 1 ? '' : 's'}` : '') : 'Sem resultados para esta pesquisa.')];
  if (kts.length) { els.push(h('div', {class: 'h2'}, 'Kits'));
    els.push(...kts.slice(0, 40).map(n => { const st = kitStatusInfo(n);
      return h('button', {class: 'card kitc', type: 'button', onclick: () => openKit(n)}, h('div', {class: 'l1'}, h('span', {class: 'nm'}, n), h('span', {class: 'st ' + st.cls}, st.txt))); })); }
  if (fol.length) { els.push(h('div', {class: 'h2'}, 'Pastas')); els.push(...fol.slice(0, 40).map(f => folderCard(f.path))); }
  if (pcs.length) { els.push(h('div', {class: 'h2'}, 'Peças')); els.push(...pcs.slice(0, 120).map(p => pieceCard(p, true)));
    if (pcs.length > 120) els.push(h('div', {class: 'hint'}, `A mostrar 120 de ${pcs.length}. Refine a pesquisa.`)); }
  main.replaceChildren(...els);
}

function viewTags() {
  const lib = S.tags.library;
  const pcs = allPieces();
  if (S.tagFilter) {
    const list = pcs.filter(p => tagOf(p.path) === S.tagFilter).sort((a, b) => cmp(display(a.key), display(b.key)));
    main.replaceChildren(
      h('div', {class: 'row', style: 'align-items:center;justify-content:space-between;flex-wrap:nowrap'},
        h('button', {class: 'crumb', type: 'button', onclick: () => { S.tagFilter = null; render(); }}, '‹ Todas as tags'), chip(S.tagFilter)),
      h('div', {class: 'hint'}, `${list.length} peça${list.length === 1 ? '' : 's'}`),
      ...list.map(p => pieceCard(p, true)));
    return;
  }
  if (!lib.length) { main.replaceChildren(h('div', {class: 'empty'}, 'Ainda não há tags. Importe o tags.json do PC.')); return; }
  const counts = {}; for (const p of pcs) { const t = tagOf(p.path); if (t) counts[t] = (counts[t] || 0) + 1; }
  main.replaceChildren(h('div', {class: 'hint'}, 'Toque numa tag para ver as peças.'),
    ...lib.map(t => h('button', {class: 'card folder', type: 'button', onclick: () => { S.tagFilter = t; render(); window.scrollTo(0, 0); }},
      chip(t), h('span', {class: 'f-name'}), h('span', {class: 'f-meta'}, `${counts[t] || 0} peça${(counts[t] || 0) === 1 ? '' : 's'}`), svg(ICON.chev, 18))));
}

function viewSummary() {
  const st = stats(S.inv);
  const mains = Object.keys(S.inv).filter(k => isFolder(S.inv[k])).sort(cmp).map(k => ({k, ...stats(S.inv[k])}));
  const max = Math.max(1, ...mains.map(m => m.units));
  const zero = allPieces().filter(p => p.qty === 0).sort((a, b) => cmp(display(a.key), display(b.key)));
  main.replaceChildren(
    h('div', {class: 'stats'},
      h('div', {class: 'stat'}, h('b', {style: 'color:var(--blue-hi)'}, st.folders), h('span', null, 'Pastas')),
      h('div', {class: 'stat'}, h('b', {style: 'color:var(--green)'}, st.pieces), h('span', null, 'Peças')),
      h('div', {class: 'stat'}, h('b', {style: 'color:var(--amber)'}, st.units), h('span', null, 'Unidades'))),
    h('div', {class: 'h2'}, 'Por pasta principal'),
    ...mains.map(m => h('button', {class: 'card mf', type: 'button', onclick: () => { S.path = [m.k]; S.view = 'folders'; render(); window.scrollTo(0, 0); }},
      h('div', {class: 'top-line'}, h('span', {class: 'nm'}, m.k), h('span', {class: 'un'}, m.units + ' un.')),
      h('div', {class: 'f-meta', style: 'color:var(--muted);font-size:12.5px'}, `${m.pieces} peças · ${m.folders} subpastas`),
      h('div', {class: 'bar'}, h('i', {style: `width:${Math.round(m.units / max * 100)}%`})))),
    h('div', {class: 'h2'}, `Sem stock (${zero.length})`),
    ...(zero.length ? zero.map(p => pieceCard(p, true)) : [h('div', {class: 'hint'}, 'Não há peças com quantidade 0.')]));
}

function viewChanges() {
  const els = [];
  const n = pending();
  els.push(h('div', {class: 'hint'}, S.log.length
    ? `${S.log.length} alteração(ões) feitas neste telemóvel` + (n ? `, ${n} por exportar.` : '. Todas exportadas.')
    : 'Ainda não fez alterações neste telemóvel.'));
  els.push(h('div', {class: 'row'},
    h('button', {class: 'btn green', type: 'button', onclick: exportLog, disabled: !S.log.length}, svg(ICON.download, 20), 'Exportar alterações')));
  if (S.log.length) els.push(h('button', {class: 'btn red block', type: 'button', onclick: resetToImported}, 'Repor ao ficheiro importado'));
  for (const e of S.log.slice().reverse()) {
    const isKit = e.tipo === 'kit', isRec = e.tipo === 'receita';
    const d = isKit ? -e.depois : isRec ? 0 : e.depois - e.antes;
    els.push(h('button', {class: 'card chg', type: 'button', style: 'width:100%;text-align:left', onclick: () => openNote(e), 'aria-label': 'Editar nota de ' + e.item},
      h('div', {class: 'l1'}, h('span', {class: 'nm'}, (isKit ? 'Kit · ' : isRec ? 'Receita · ' : '') + e.item), h('span', {class: 'delta ' + (d >= 0 ? 'up' : 'down')}, isRec ? ({criar: 'criada', editar: 'editada', apagar: 'apagada'}[e.receita && e.receita.acao] || 'receita') : isKit ? e.depois + ' kit(s)' : (d >= 0 ? '+' : '−') + Math.abs(d))),
      h('div', {class: 'dt'}, isRec ? (e.detalhe || '') : isKit ? (e.itens || []).join(' · ') : `${e.caminho}  ·  ${e.antes} → ${e.depois}` + (e.detalhe ? `  ·  ${e.detalhe}` : '')),
      h('div', {class: 'tm'}, `${e.ts.slice(8, 10)}/${e.ts.slice(5, 7)}/${e.ts.slice(0, 4)} ${e.ts.slice(11, 16)}`),
      e.nota ? h('div', {class: 'note'}, 'Nota: ' + e.nota) : h('div', {class: 'tm'}, 'Toque para adicionar nota')));
  }
  main.replaceChildren(...els);
}

/* ---------- navegação e desenho ---------- */
const TABS = [['folders', 'Pastas', 'folder'], ['tags', 'Tags', 'tag'], ['kits', 'Kits', 'kit'], ['summary', 'Resumo', 'chart'], ['changes', 'Alterações', 'list']];
function renderTabs() {
  const box = document.getElementById('tabs');
  box.replaceChildren(...TABS.map(([id, label, icon]) => {
    const b = h('button', {class: 'tab', type: 'button', 'aria-current': S.view === id && !S.query.trim() ? 'page' : null,
      onclick: async () => { if (!(await leaveEdit())) return; S.view = id; if (id !== 'tags') S.tagFilter = null; S.kit = null; clearSearch(false); render(); window.scrollTo(0, 0); }}, svg(ICON[icon], 22), label);
    if (id === 'changes' && pending() > 0) b.append(h('span', {class: 'pill'}, pending()));
    return b;
  }));
}
function clearSearch(doRender = true) {
  S.query = ''; const q = document.getElementById('q'); q.value = ''; document.getElementById('q-clear').hidden = true;
  if (doRender) render();
}
/* quanto tempo passou desde a importação do inventario.json (texto curto para o topo) */
function importadoHa() {
  if (!S.meta.importedAt) return '';
  const t = new Date(S.meta.importedAt);
  if (isNaN(t)) return '';
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dia = new Date(t); dia.setHours(0, 0, 0, 0);
  const dias = Math.round((hoje - dia) / 86400000);
  const quanto = dias <= 0 ? 'hoje' : dias === 1 ? 'há 1 dia' : `há ${dias} dias`;
  return `importado ${quanto} (${t.toLocaleDateString('pt-PT')})`;
}
function render(keepScroll) {
  const y = window.scrollY;
  renderTabs();
  const sub = document.getElementById('subtitle');
  if (!S.inv) { sub.textContent = 'Inventário'; viewWelcome(); return; }
  const st = stats(S.inv);
  const quando = importadoHa();
  sub.textContent = `${st.pieces} peças · ${st.units} un.` + (quando ? ` · ${quando}` : '');
  if (S.query.trim()) viewSearch();
  else if (S.view === 'tags') viewTags();
  else if (S.view === 'kits') viewKits();
  else if (S.view === 'summary') viewSummary();
  else if (S.view === 'changes') viewChanges();
  else viewFolders();
  if (keepScroll) window.scrollTo(0, y);
}

/* ---------- eventos ---------- */
let qTimer = null;
document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value;
  document.getElementById('q-clear').hidden = !v;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.query = v; render(); }, 120);
});
document.getElementById('q-clear').addEventListener('click', () => { clearSearch(); document.getElementById('q').focus(); });
document.getElementById('btn-menu').addEventListener('click', openMenu);
document.getElementById('file').addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  if (files.length) importFiles(files);
});

render();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
