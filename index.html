<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gest</title>
<style>
/* Gest — estilo (tokens e componentes). Nenhuma cor fixa nos componentes: tudo via var(--…). */
:root{
  --bg:#0b0b0c; --surface:#131314; --surface-2:#1c1c1e; --line:#27272a; --text:#f3f3f5; --muted:#8d8d93;
  --accent:#60a5fa; --accent-2:#60a5fa; --good:#34d399; --danger:#f87171; --amber:#fbbf24; --purple:#c084fc;
  --c1:#3b82f6; --c2:#2563eb;
  --grad:linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%);
  --grad-relief:linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%);
  --on-grad:#ffffff;
  --radius:20px; --nav-h:64px; --gutter:20px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  /* nomes antigos, usados pelo JavaScript */
  --green:var(--good); --red:var(--danger); --blue-hi:var(--accent); --text-strong:var(--text); --dim:var(--muted);
}
:root[data-mode="light"]{
  --bg:#f4f5f9; --surface:#ffffff; --surface-2:#eef0f5; --line:#e1e4ec; --text:#12151c; --muted:#6b7385;
  --good:#10b981; --danger:#ef4444; --amber:#d97706; --purple:#9333ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior-y:none;scrollbar-width:none}
html::-webkit-scrollbar,*::-webkit-scrollbar{display:none}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none;transition:background-color .3s,color .3s}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
.app{width:100%;max-width:720px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px var(--gutter) 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;transition:background-color .3s}
.top-row{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-weight:800;font-size:28px;letter-spacing:-.02em;color:var(--text);flex:1;min-width:0;line-height:1.1;overflow:hidden}
.brand small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--text);background:var(--surface);border:1px solid var(--line);transition:transform .1s}
.icon-btn:active{transform:scale(.96)}
.search{position:relative}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 46px 0 16px;font:inherit;outline:none;transition:border-color .2s,background-color .3s}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.search .clear{position:absolute;right:2px;top:2px;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}

/* conteúdo */
main{flex:1;min-width:0;padding:8px var(--gutter) calc(var(--nav-h) + 88px + var(--safe-b));display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
main.enter>*{animation:rise .25s ease both}
main.enter>*:nth-child(2){animation-delay:.03s}main.enter>*:nth-child(3){animation-delay:.06s}main.enter>*:nth-child(4){animation-delay:.09s}
main.enter>*:nth-child(5){animation-delay:.12s}main.enter>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;align-items:center}
.crumb{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:600;white-space:nowrap}
.crumb.cur{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:var(--accent);color:var(--text)}
.sep{color:var(--muted);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 16px;transition:background-color .3s,border-color .3s}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.folder{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:68px}
.folder:active{transform:scale(.99)}
.folder .f-name{flex:1;min-width:0;color:var(--text);font-weight:700;overflow-wrap:anywhere}
.folder .f-meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.folder .f-txt{flex:1;min-width:0;display:grid;gap:2px}
.folder .f-txt .f-meta{white-space:normal}
.folder>svg{flex:none;color:var(--muted)}
.piece{display:flex;align-items:center;gap:10px;box-shadow:inset 4px 0 0 var(--pc,transparent)}
.piece.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--accent) 24%,var(--surface))}100%{background:var(--surface)}}
.p-info{flex:1;min-width:0;display:grid;gap:6px;justify-items:start}
.p-name{font-weight:700;color:var(--text);text-align:left;overflow-wrap:anywhere;line-height:1.25}
.p-path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0;max-width:100%}
.p-info>*{max-width:100%}
.chip{display:inline-block;font-size:12px;font-weight:650;padding:2px 10px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.chip{cursor:pointer}
.chip.lot{background:none;border:1px solid color-mix(in srgb,var(--good) 55%,transparent);color:var(--good);font-weight:600}
.chip.kit{background:none;border:1px solid color-mix(in srgb,var(--accent-2) 60%,transparent);color:var(--accent);font-weight:600}
.ctrl{display:flex;align-items:center;gap:6px;flex:none}
.ctrl button{width:44px;height:44px;border-radius:14px;font-size:22px;font-weight:700;display:grid;place-items:center;transition:transform .1s}
.ctrl button:active{transform:scale(.94)}
.ctrl .minus{background:var(--surface-2);color:var(--danger)}
.ctrl .plus{background:var(--surface-2);color:var(--accent)}
.ctrl .qty{width:auto;min-width:54px;padding:0 8px;font-size:17px;background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good);font-variant-numeric:tabular-nums}
.ctrl .qty.zero{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.hint{color:var(--muted);font-size:13.5px;padding:0 2px}
.h2{font-size:13px;color:var(--muted);font-weight:600;margin:8px 2px -4px}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 20px;display:grid;gap:16px}
.welcome h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.welcome p{margin:0;font-size:15px}
.welcome ol{margin:0;padding-left:20px;font-size:15px;display:grid;gap:6px}

/* botões */
.btn{min-height:52px;border-radius:999px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:var(--surface);border:1px solid var(--line);color:var(--text);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.green,.btn.teal{background:var(--grad);background-origin:border-box;background-clip:border-box;color:var(--on-grad);border-color:transparent}   /* o fundo cobre também a borda: sem cores repetidas nos cantos */   /* o único botão principal do ecrã */
.btn.gray{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn.red{background:transparent;border-color:transparent;color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.btn{flex:1 1 140px}

/* resumo */
.big-total{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:grid;gap:2px}
.big-total span{font-size:13px;font-weight:600;color:var(--muted)}
.big-total b{font-size:40px;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.big-total small{font-size:13px;color:var(--muted)}
.reminder{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;font-size:14px;
  background:color-mix(in srgb,var(--accent-2) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent-2) 40%,transparent)}
.reminder svg{flex:none;color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:3px}
.mf{display:grid;gap:2px;width:100%;text-align:left}
.mf .top-line{display:flex;justify-content:space-between;gap:10px}
.mf .nm{font-weight:700}.mf .un{color:var(--accent);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

/* alterações */
.chg{display:grid;gap:4px}
.chg .l1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chg .nm{font-weight:700;overflow-wrap:anywhere}
.chg .tm{font-size:12px;color:var(--muted);white-space:nowrap}
.chg .dt{font-size:13px;color:var(--muted)}
.chg .note{font-size:13px;color:var(--amber);font-style:italic}
.delta{font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.up{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.delta.down{background:color-mix(in srgb,var(--danger) 16%,var(--surface));color:var(--danger)}
.pill{background:var(--accent);color:var(--bg);font-weight:800;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px;position:absolute;top:8px;right:calc(50% - 24px)}

/* navegação inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 97%,transparent);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);transition:background-color .3s}
nav.tabs .in{width:100%;max-width:720px;display:flex;position:relative}
.tab{flex:1}
#tabs{display:contents}
.tab{height:var(--nav-h);display:grid;justify-items:center;align-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;position:relative;transition:color .2s}
.tab[aria-current="page"]{color:var(--accent)}
.ind{position:absolute;top:0;left:0;width:25%;height:3px;display:grid;place-items:start center;transform:translateX(calc(var(--i,0)*100%));transition:transform .3s var(--ease),opacity .2s;pointer-events:none}
.ind::after{content:"";width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* folhas e diálogos */
#sheets{position:fixed;inset:0 0 var(--kb,0px) 0;z-index:50;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.backdrop.dlg{align-items:center;padding:20px}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:28px 28px 0 0;padding:12px var(--gutter) calc(24px + var(--safe-b));display:grid;gap:16px;max-height:96%;overflow:auto;animation:up .28s var(--ease)}
.dlg .sheet{width:min(340px,100%);background:var(--surface);border-radius:26px;padding:26px 22px 20px;text-align:center;box-shadow:0 24px 60px -12px rgba(0,0,0,.55);animation:pop .38s cubic-bezier(.2,1.3,.4,1)}
.grab{width:100%;height:30px;margin:-6px 0 -10px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab span{width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.5}
.app{padding-left:14px}
.edge{position:fixed;left:0;top:50%;transform:translateY(-50%);width:14px;height:88px;z-index:25;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;touch-action:none;cursor:grab}
.edge span{width:3px;height:32px;border-radius:2px;background:var(--muted);opacity:.55}
body.onb .edge{display:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet p{margin:0;font-size:15px}
.sheet .sub{color:var(--muted);font-size:13.5px}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);background:var(--surface-2);padding:4px;border-radius:14px;position:relative}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,2));border-radius:11px;background:var(--surface);
  box-shadow:0 2px 8px rgba(0,0,0,.2);transform:translateX(calc(var(--i,0)*100%));transition:transform .25s var(--ease)}
.seg button{position:relative;padding:11px 4px;border-radius:11px;font-weight:600;color:var(--muted);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--text)}
.field{width:100%;height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:800 28px system-ui;padding:0 16px;text-align:center;outline:none;transition:border-color .2s;font-variant-numeric:tabular-nums}
.field:focus{border-color:var(--accent)}
.dlg .field,.sheet .field{-webkit-user-select:text;user-select:text}
textarea.field{height:110px;padding:14px 16px;font:16px/1.4 system-ui;text-align:left;resize:vertical}
.field.sm{height:52px;font:16px system-ui;text-align:left}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{height:44px;border-radius:14px;background:var(--surface-2);font-weight:700;transition:transform .1s}
.quick button:active{transform:scale(.96)}
.preview{text-align:center;font-size:17px}
.preview b{color:var(--accent)}
.preview.warn{color:var(--amber);font-size:14px}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;border-radius:16px;padding:0 16px;text-align:left;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.menu-item:active{transform:scale(.99)}
.menu-item svg{color:var(--accent);flex:none}
.menu-item small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.sel{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 12px;font:inherit}
.xrow{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.xrow:first-child{border-top:0}
.opt{width:100%;min-height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:8px 16px;text-align:left;display:grid;gap:1px;font-weight:600}
.opt small{color:var(--muted);font-weight:400;font-size:12.5px}
.opt:active{transform:scale(.99)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.lotline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.lotline:first-child,.comp:first-child{border-top:0}

/* escolhas e interruptores (Aspeto) */
.choices{display:flex;flex-wrap:wrap;gap:8px}
.pchoice{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:transform .22s cubic-bezier(.3,1.5,.5,1),border-color .2s,background-color .2s}
.pchoice.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));transform:scale(1.03)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left}
.switch-row b{display:block;font-weight:700}.switch-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.switch{width:48px;height:28px;border-radius:14px;background:var(--surface-2);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--accent)}.switch.on::after{background:#fff;transform:translateX(20px)}

/* kits */
.kitc{display:grid;gap:4px;width:100%;text-align:left;min-height:64px}
.kitc .l1{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kitc .nm{font-weight:700;overflow-wrap:anywhere}
.kitc .meta{font-size:12.5px;color:var(--muted)}
.st{font-size:12.5px;font-weight:700;white-space:nowrap}.st.ok{color:var(--good)}.st.bad{color:var(--danger)}.st.warn{color:var(--amber)}
.comp{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.comp .q{min-width:40px;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.comp .tx{flex:1;min-width:0;display:grid;gap:2px;text-align:left}
.comp .tx .nm{font-weight:600;overflow-wrap:anywhere}
.comp .tx small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.comp .have{font-size:12.5px;font-weight:700;white-space:nowrap}

.ptitle{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:2px}
.stat3 span{font-size:13px;color:var(--muted);font-weight:600}
.stat3 b{font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chip.lab{background:none;border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);color:var(--amber);font-weight:600}
.dotbadge{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.icon-btn{position:relative}
/* menu lateral */
.dback{position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:auto;opacity:0;transition:opacity .28s}
.dback.open{opacity:1}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;pointer-events:auto;
  transform:translateX(-100%);transition:transform .28s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:var(--safe-b)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:16px 16px 8px 20px}
.dnav{display:grid;gap:4px;padding:6px 10px}
.dn{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;border-radius:14px;padding:0 12px;font-weight:600;text-align:left;transition:background-color .2s}
.dn svg{color:var(--muted);flex:none}
.dn.on{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.dn.on svg{color:var(--accent)}
.dn:active{transform:scale(.99)}
.dpill{background:var(--accent);color:var(--bg);font-weight:800;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px}
.dlist{flex:1;overflow:auto;padding:6px 10px 10px;border-top:1px solid var(--line)}
.drow{display:flex;align-items:center;gap:6px;min-height:44px;border-radius:12px;padding-right:10px}
.drow.on{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.dchev{width:30px;height:44px;display:grid;place-items:center;flex:none;color:var(--muted);transition:transform .2s}
.dchev.open{transform:rotate(90deg)}
.dsq{width:9px;height:9px;border-radius:3px;flex:none}

<script>
/* Tema do Gest: paleta (par de cores do gradiente + realces) e modo (escuro, claro, automático e as duas variações com cor).
   Corre no <head> para a app abrir já com as cores certas, sem piscar. */
(function () {
  'use strict';
  const PALETTES = {
    classico:  {n: 'Clássico',  g: ['#3b82f6', '#2563eb'], dark: '#60a5fa', light: '#2563eb', a2: '#60a5fa'},
    esmeralda: {n: 'Esmeralda', g: ['#34d399', '#6366f1'], dark: '#34d399', light: '#10b981', a2: '#6366f1'},
    rosa:      {n: 'Rosa',      g: ['#f472b6', '#a78bfa'], dark: '#f472b6', light: '#db2777', a2: '#a78bfa'},
    aurora:    {n: 'Aurora',    g: ['#5eead4', '#a855f7'], dark: '#a78bfa', light: '#7c3aed', a2: '#a855f7'},
    cereja:    {n: 'Cereja',    g: ['#fb7185', '#9f1239'], dark: '#fb7185', light: '#e11d48'},
    floresta:  {n: 'Floresta',  g: ['#bef264', '#15803d'], dark: '#a3e635', light: '#65a30d'},
    tropical:  {n: 'Tropical',  g: ['#a3e635', '#06b6d4'], dark: '#a3e635', light: '#0d9488', a2: '#06b6d4'},
    menta:     {n: 'Menta',     g: ['#a7f3d0', '#0ea5e9'], dark: '#5eead4', light: '#0d9488', a2: '#0ea5e9'},
    lavanda:   {n: 'Lavanda',   g: ['#e9d5ff', '#6366f1'], dark: '#a5b4fc', light: '#6366f1', a2: '#6366f1'},
    algodao:   {n: 'Algodão',   g: ['#f9a8d4', '#7dd3fc'], dark: '#f9a8d4', light: '#db2777', a2: '#7dd3fc'},
    grafite:   {n: 'Grafite',   g: ['#f3f4f6', '#6b7280'], dark: '#e5e7eb', light: '#374151'}
  };
  const MODES = [['escuro', 'Escuro'], ['claro', 'Claro'], ['auto', 'Automático'], ['auto_escuro', 'Auto escuro'], ['auto_claro', 'Auto claro']];
  const KEY = 'gkever.ui';   // só gostos visuais; as chaves dos dados não se tocam
  const DEFAULT = {pal: 'classico', mode: 'escuro', dens: 'compacta'};

  const rgb = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const hex = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); return hex(x.map((v, i) => v + (y[i] - v) * t)); };   // t = parte de b
  const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };

  let prefs = Object.assign({}, DEFAULT);
  try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') prefs = Object.assign(prefs, p); } } catch (e) {}
  if (!PALETTES[prefs.pal]) prefs.pal = DEFAULT.pal;
  if (!MODES.some(m => m[0] === prefs.mode)) prefs.mode = DEFAULT.mode;
  if (prefs.dens !== 'compacta' && prefs.dens !== 'conf') prefs.dens = 'compacta';
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

  function apply() {
    const root = document.documentElement, st = root.style, pal = PALETTES[prefs.pal];
    const light = prefs.mode === 'claro' || prefs.mode === 'auto_claro' || (prefs.mode === 'auto' && mq && mq.matches);
    const accent = light ? pal.light : pal.dark;
    const [c1, c2] = pal.g;
    root.setAttribute('data-mode', light ? 'light' : 'dark');
    root.setAttribute('data-dens', prefs.dens);
    st.setProperty('--accent', accent);
    st.setProperty('--accent-2', pal.a2 || (lum(c2) < .2 ? mix(c2, pal.dark, .55) : c2));
    st.setProperty('--c1', c1); st.setProperty('--c2', c2);
    st.setProperty('--grad', `linear-gradient(135deg, ${c1} 0%, ${c2} 100%)`);
    const hi = mix(mix(c1, c2, .18), '#ffffff', .10), lo = mix(mix(c1, c2, .82), '#000000', .12);
    st.setProperty('--grad-relief', `linear-gradient(135deg, ${hi} 0%, ${c1} 34%, ${c2} 68%, ${lo} 100%)`);
    st.setProperty('--on-grad', lum(mix(c1, c2, .5)) > .42 ? '#04130d' : '#ffffff');
    const tinted = prefs.mode === 'auto_escuro' || prefs.mode === 'auto_claro';
    const set = (name, v) => v ? st.setProperty(name, v) : st.removeProperty(name);
    if (tinted && !light) {   // um toque leve da cor escolhida em vez de cinzento neutro
      set('--bg', mix('#0b0b0c', accent, .07)); set('--surface', mix('#131314', accent, .09));
      set('--surface-2', mix('#1c1c1e', accent, .105)); set('--line', mix('#27272a', accent, .12));
    } else if (tinted && light) {
      set('--bg', mix('#f5f5f6', accent, .09)); set('--surface', mix('#ffffff', accent, .04));
      set('--surface-2', mix('#eeeff1', accent, .11)); set('--line', mix('#e2e3e7', accent, .14));
    } else { ['--bg', '--surface', '--surface-2', '--line'].forEach(n => set(n, null)); }
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--bg').trim() || '#0b0b0c');
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) {} }
  window.GestTheme = {
    PALETTES, MODES,
    get: () => Object.assign({}, prefs),
    set(patch) { prefs = Object.assign(prefs, patch); persist(); apply(); }
  };
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (prefs.mode === 'auto') apply(); });
  apply();
})();
</script>

<script>
(function () {
'use strict';

/* ---------- constantes e estado ---------- */
const SEP = '::ID::';
const newId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const PALETTE = [
  {bg:'#0369A1',fg:'#E0F2FE'},{bg:'#6D28D9',fg:'#EDE9FE'},{bg:'#B45309',fg:'#FEF3C7'},{bg:'#047857',fg:'#D1FAE5'},
  {bg:'#BE185D',fg:'#FCE7F3'},{bg:'#4338CA',fg:'#E0E7FF'},{bg:'#0F766E',fg:'#CCFBF1'},{bg:'#9A3412',fg:'#FFEDD5'}
];
const K = {inv:'gkever.inv', base:'gkever.base', tags:'gkever.tags', log:'gkever.log', meta:'gkever.meta', lots:'gkever.lots', kits:'gkever.kits', baselots:'gkever.baselots', basekits:'gkever.basekits', labels:'gkever.labels', basetags:'gkever.basetags', baselabels:'gkever.baselabels'};
let storageWarned = false;

function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { if (!storageWarned) { storageWarned = true; toast('Não foi possível guardar no telemóvel (armazenamento cheio ou bloqueado).'); } return false; }
}

const S = {
  inv: load(K.inv, null), base: load(K.base, null),
  tags: load(K.tags, {library: [], assignments: {}}),
  log: load(K.log, []), meta: load(K.meta, {importedAt: null, exportedLen: 0}),
  lots: load(K.lots, {}), kits: load(K.kits, {}), baseLots: load(K.baselots, null), baseKits: load(K.basekits, null), baseTags: load(K.basetags, null), baseLabels: load(K.baselabels, null),
  view: 'folders', path: [], kit: null, edit: null, tagFilter: null, labelFilter: null, lotFilter: null, sb: 'folders', exp: new Set(),
  labels: load(K.labels, {library: {}, assignments: {}}), query: '', highlight: null
};
const cloneLots = o => JSON.parse(JSON.stringify(o || {}));
if (!S.baseKits) { S.baseKits = cloneLots(S.kits); save(K.basekits, S.baseKits); }
if (!S.baseLots) { S.baseLots = cloneLots(S.lots); save(K.baselots, S.baseLots); }  // quem já importou na versão anterior
if (!S.labels || typeof S.labels !== 'object' || !S.labels.library || !S.labels.assignments) S.labels = {library: {}, assignments: {}};
if (!S.tags || !Array.isArray(S.tags.library)) S.tags = {library: [], assignments: {}};
if (!S.baseTags) { S.baseTags = cloneLots(S.tags); save(K.basetags, S.baseTags); }   // para 'Repor ao ficheiro importado'
if (!S.baseLabels) { S.baseLabels = cloneLots(S.labels); save(K.baselabels, S.baseLabels); }
// alterações feitas antes desta versão não têm 'id': dão-se-lhes um, para não serem importadas duas vezes
if (Array.isArray(S.log) && S.log.some(e => e && !e.id)) { S.log.forEach(e => { if (e && !e.id) e.id = newId(); }); save(K.log, S.log); }

/* ---------- lotes e kits (mesmas regras do PC: app_lotes.py / app_kits.py) ---------- */
// JSON.parse reordena chaves que sejam números ("10" antes de "2"), o que estragaria o FIFO dos lotes:
// por isso a ordem dos lotes lê-se do texto e guarda-se como lista de pares [lote, qtd].
function parseOrdered(text) {
  let i = 0;
  const ws = () => { while (i < text.length && ' \t\n\r'.includes(text[i])) i++; };
  const str = () => { const a = i; i++; while (text[i] !== '"') { if (text[i] === '\\') i++; i++; } i++; return JSON.parse(text.slice(a, i)); };
  function val() {
    ws(); const c = text[i];
    if (c === '{') {
      i++; const out = {pairs: []}; ws();
      if (text[i] === '}') { i++; return out; }
      for (;;) { ws(); const k = str(); ws(); i++; out.pairs.push([k, val()]); ws(); if (text[i++] === '}') return out; }
    }
    if (c === '[') {
      i++; const out = []; ws();
      if (text[i] === ']') { i++; return out; }
      for (;;) { out.push(val()); ws(); if (text[i++] === ']') return out; }
    }
    if (c === '"') return str();
    const m = /^(-?\d+(\.\d+)?([eE][+-]?\d+)?|true|false|null)/.exec(text.slice(i, i + 40));

  }
  return val();

function readLots(text, d) {

function doKitExit(name, n, kitLote, choices) {
  const st = kitStatus(name, n);
  if (st.falta.length || st.problems.length || st.empty) return false;
  const {req} = kitFlat(name);
  const moves = [];
  const items = [];
  for (const [key, need1] of req) {
    const need = need1 * n, path = key.split('\n'), old = pieceQty(key), lots = pieceLots(path);
    let text = `${need}× ${display(path[path.length - 1])}`, textLots = '', deltas = [], newLots = null;
    if (lots.length) {
      const r = lotTake(lots, old - sumLots(lots), need, choices[key]);
      newLots = r.lots; textLots = ' (' + r.take.map(([l, q]) => l ? `lote ${l}: ${q}` : `sem lote: ${q}`).join(', ') + ')'; text += textLots;
      deltas = r.take.filter(x => x[0] !== '').map(([l, q]) => [l, -q]);
    }
    items.push(text);
    moves.push({path, old, need, deltas, newLots, textLots, snap: snapOf(path)});
  }
  const ts = nowStr(), kitId = newId();
  const nota = `Saiu junto com o kit «${name}»` + (kitLote ? ` (lote do kit: ${kitLote})` : '');
  const parts = [];
  for (const m of moves) {
    const parent = getNode(m.path.slice(0, -1)), key = m.path[m.path.length - 1];
    parent[key] = m.old - m.need;
    if (m.newLots) setLots(m.path, m.newLots);
    const e = {ts, tipo: 'qtd', alvo: 'peça', item: display(key), caminho: m.path.slice(0, -1).join(' > '), antes: m.old, depois: m.old - m.need,
               detalhe: `saída com o kit «${name}»` + m.textLots, nota, origem: 'telemovel', id: newId(), chave: m.path.slice(), kit_ref: kitId};
    if (m.deltas.length) e.lotes = m.deltas;
    parts.push(e);
  }
  const kitEntry = {ts, tipo: 'kit', alvo: 'kit', item: name, caminho: '', antes: null, depois: n,
                    detalhe: `saída de ${n} kit(s)` + (kitLote ? ` · lote do kit: ${kitLote}` : ''), nota: '', origem: 'telemovel',
                    id: kitId, itens: items, kit_lote: kitLote || '', partes: parts.map(e => e.id)};
  S.log.push(kitEntry, ...parts);

  lastChange = {snap: moves.map(m => m.snap), entries: [kitEntry, ...parts]};
  toast(`Saída de ${n} kit${n === 1 ? '' : 's'} «${name}»`, {label: 'Desfazer', fn: undo});

}

/* ---------- importar / exportar ---------- */
function detect(d) {
  if (d && d.gest_backup === 1) return 'backup';
  if (d && Array.isArray(d.entries)) return 'hist';
  if (d && Array.isArray(d.library) && isFolder(d.assignments)) return 'tags';
  if (validInv(d)) return 'inv';
  return null;
}
async function importFiles(files) {
  let inv = null, tags = null, tagsText = '', invName = '', backup = null;
  const problems = [];
  for (const f of files) {
    try {
      const text = await f.text();
      const d = JSON.parse(text);
      const kind = detect(d);
      if (kind === 'backup') { backup = d; continue; }
      if (kind === 'inv') { inv = d; invName = f.name; }
      else if (kind === 'tags') { tags = d; tagsText = text; }
      else if (kind === 'hist') problems.push(`${f.name}: é um ficheiro de histórico, não de inventário.`);
      else problems.push(`${f.name}: não parece ser um inventario.json nem um tags.json.`);
    } catch (e) { problems.push(`${f.name}: não é um ficheiro JSON válido.`); }
  }
  if (backup) { await restoreBackup(backup); return; }
  if (!inv && !tags) {
    openSheet([h('h3', null, 'Nada importado'), h('p', null, problems.join(' ') || 'Escolha o inventario.json e o tags.json.'),
      h('button', {class: 'btn gray block', type: 'button', onclick: e => e.target.closest('.backdrop').remove()}, 'Fechar')]);
    return;
  }
  if (inv && pending() > 0) {
    const ok = await ask({title: 'Substituir o inventário?', danger: true, ok: 'Importar e descartar',
      text: `Tem ${pending()} alteração(ões) de quantidade que ainda não exportou. Se importar agora, perdem-se.`});
    if (!ok) return;
  }
  if (inv) {
    S.inv = inv; S.base = JSON.parse(JSON.stringify(inv)); S.log = []; S.lots = cloneLots(S.baseLots); S.kits = cloneLots(S.baseKits); S.tags = cloneLots(S.baseTags); S.labels = cloneLots(S.baseLabels); kitIdx = null; S.edit = null; save(K.lots, S.lots); save(K.kits, S.kits); save(K.tags, S.tags); save(K.labels, S.labels);
    S.meta = {importedAt: new Date().toISOString(), exportedLen: 0, file: invName};
    S.path = []; S.tagFilter = null; lastChange = null;
    save(K.inv, S.inv); save(K.base, S.base); save(K.log, S.log); save(K.meta, S.meta);
  }
  if (tags && !inv && pending() > 0) {
    const ok = await ask({title: 'Substituir lotes e kits?', danger: true, ok: 'Importar',
      text: `Tem ${pending()} alteração(ões) por exportar. O ficheiro novo não inclui o que já fez aqui (saídas de kits, pastas e peças criadas ou movidas, receitas...), por isso o que vê deixa de bater certo. Exporte primeiro.`});
    if (!ok) tags = null;
  }
  if (tags) {
    S.tags = {library: tags.library.filter(t => typeof t === 'string'), assignments: tags.assignments};
    S.lots = readLots(tagsText, tags); S.baseLots = cloneLots(S.lots); S.kits = readKits(tags); S.baseKits = cloneLots(S.kits); S.labels = readLabels(tags); S.baseLabels = cloneLots(S.labels); S.baseTags = cloneLots(S.tags); save(K.labels, S.labels); save(K.baselabels, S.baseLabels); save(K.basetags, S.baseTags); kitIdx = null; S.kit = null; S.edit = null;
    save(K.tags, S.tags); save(K.lots, S.lots); save(K.baselots, S.baseLots); save(K.kits, S.kits); save(K.basekits, S.baseKits);
  }
  const parts = [];
  if (inv) parts.push(`inventário (${stats(S.inv).pieces} peças)`);
  if (tags) parts.push(`tags (${S.tags.library.length}), etiquetas (${Object.keys(S.labels.library).length}), kits (${kitNames().length}), peças com lotes (${Object.keys(S.lots).length})`);
  toast('Importado: ' + parts.join(' e ') + (problems.length ? '. Ignorados: ' + problems.length : '.'));
  render();
}

function readLabels(d) {
  const lb = isFolder(d.labels) ? d.labels : {};
  const library = {}, assignments = {};
  if (isFolder(lb.library)) for (const [n, v] of Object.entries(lb.library)) library[n] = {tipo: isFolder(v) && v.tipo === 'valor' ? 'valor' : 'livre'};
  if (isFolder(lb.assignments)) for (const [k, m] of Object.entries(lb.assignments)) {
    if (!isFolder(m)) continue;
    const o = {};
    for (const [n, v] of Object.entries(m)) if (n in library) o[n] = v == null ? '' : String(v);
    if (Object.keys(o).length) assignments[k] = o;

  return {library, assignments};
}

function drawerTree(node, path, depth, out) {

/* ---------- estrutura: criar, renomear, mover, copiar e apagar pastas e peças (as mesmas regras do PC) ---------- */
const ESTR = {criar: 'criada', renomear: 'renomeada', mover: 'movida', copiar: 'copiada', apagar: 'apagada', editar: 'editada'};
const recBadge = e => e.tipo === 'atributo' ? 'alterada' : e.tipo === 'estrutura' ? (ESTR[e.acao] || 'estrutura') : (ESTR[e.receita && e.receita.acao] || 'receita');

function restoreAll(str) {

        if (isF) {

        if (!copy && pkey(op.para) === pkey(par)) return {err: 'Já está nessa pasta.'};
        if (isF && underPath(op.para, op.de)) return {err: 'Não se pode pôr uma pasta dentro dela própria.'};
        if (isF) {

          remapPrefix(op.de, op.para.concat(nk), copy);
        }
        Object.assign(entry, {de: op.de.slice(), para: op.para.slice(), nome: itemName});

      } else if (op.acao === 'apagar') {

/* caixas de escrita e escolha de pasta */
function askText({title, sub, value = '', placeholder = '', ok = 'Guardar', numeric = false}) {
  return new Promise(res => {
    let done = false;
    const finish = v => { if (!done) { done = true; res(v); } };
    const input = h('input', {class: numeric ? 'field' : 'field sm', type: 'text', autocomplete: 'off', autocapitalize: 'sentences', maxlength: numeric ? 7 : 80, placeholder, 'aria-label': title, value});
    if (numeric) { input.setAttribute('inputmode', 'numeric'); input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, ''); }); }
    const go = () => { finish(input.value); close(); };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    const close = openSheet([
      h('div', null, h('h3', null, title), sub ? h('div', {class: 'sub'}, sub) : null), input,
      h('div', {class: 'row'}, h('button', {class: 'btn gray', type: 'button', onclick: () => close()}, 'Cancelar'), h('button', {class: 'btn green', type: 'button', onclick: go}, ok))
    ], () => finish(null));
  });
}
function pickFolder({title, sub, exclude, allowRoot, current}) {
  return new Promise(res => {
    let done = false;
    const finish = v => { if (!done) { done = true; res(v); } };
    const curK = current ? pkey(current) : null, rows = [], excl = exclude ? (Array.isArray(exclude[0]) ? exclude : [exclude]) : [];
    const row = (path, label, depth) => {
      const bad = pkey(path) === curK && current != null;
      return h('button', {class: 'pick', type: 'button', disabled: bad, style: `padding-left:${10 + depth * 18}px`, onclick: () => { finish(path); close(); }},
        h('span', {class: 'dsq', style: 'background:' + (path.length ? colorFor(path[0]) : 'var(--muted)')}), h('span', {style: 'flex:1;overflow-wrap:anywhere'}, label), bad ? h('small', {style: 'color:var(--muted)'}, 'aqui') : null);
    };
    if (allowRoot) rows.push(row([], 'Raiz (pasta principal)', 0));
    (function walk(node, path, depth) {
      for (const k of Object.keys(node).filter(x => isFolder(node[x])).sort(cmp)) {
        const p = path.concat(k);
        if (excl.some(x => underPath(p, x))) continue;
        rows.push(row(p, k, depth + (allowRoot ? 1 : 0)));
        walk(node[k], p, depth + 1);
      }
    })(S.inv, [], 0);
    const close = openSheet([
      h('div', null, h('h3', null, title), sub ? h('div', {class: 'sub'}, sub) : null),
      rows.length ? h('div', {class: 'panel', style: 'max-height:52vh;overflow:auto;padding:6px 8px'}, ...rows) : h('div', {class: 'hint'}, 'Ainda não há pastas.'),
      h('button', {class: 'btn gray block', type: 'button', onclick: () => close()}, 'Cancelar')
    ], () => finish(null));
  });
}

  if (name === null) return;
  if (runStruct({acao: 'criar', alvo: 'pasta', para: parentPath, nome: name}, `Pasta «${name.trim()}» criada.`) && !parentPath.length) { S.view = 'folders'; S.path = [name.trim()]; render(); window.scrollTo(0, 0); }
}
async function flowNewPiece(folderPath) {
  const name = await askText({title: 'Adicionar peça', sub: `Em «${folderPath[folderPath.length - 1]}»`, value: folderPath[folderPath.length - 1] + ' ', placeholder: 'Nome da peça', ok: 'Seguinte'});
  if (name === null) return;
  const nm = cleanName(name);
  if (!nm) { toast('Escreva um nome válido.'); return; }
  const node = getNode(folderPath);
  if (isFolder(node) && (hasFolderNamed(node, nm) || hasPieceNamed(node, nm))) { toast(`Já existe «${nm}» nessa pasta.`); return; }

  if (q === null) return;

}

  const sort = h('select', {class: 'sel', 'aria-label': 'Ordenar'}, ...[['nome', 'Ordenar: nome'], ['qtd_up', 'Ordenar: menos stock primeiro'], ['qtd_down', 'Ordenar: mais stock primeiro']].map(([k, l]) => h('option', Object.assign({value: k}, o.sort === k ? {selected: true} : {}), l)));
  sort.addEventListener('change', () => { o.sort = sort.value; renderList(); });
  const zero = h('button', {type: 'button', class: 'switch-row', role: 'switch', 'aria-checked': String(o.zero), onclick: () => { o.zero = !o.zero; zero.setAttribute('aria-checked', String(o.zero)); zero.querySelector('.switch').classList.toggle('on', o.zero); renderList(); }},
    h('span', null, h('b', null, 'Só peças sem stock')), h('span', {class: 'switch' + (o.zero ? ' on' : '')}));
  const info = h('div', {class: 'hint'}), box = h('div', {class: 'panel'});
  function renderList() {
    const list = ovFilter(), units = list.reduce((a, p) => a + p.qty, 0);
    info.textContent = `${fmt(list.length)} peça${list.length === 1 ? '' : 's'} · ${fmt(units)} un.`;
    box.replaceChildren(...(list.length ? list.slice(0, 300).map(p => {
      const extra = [tagOf(p.path), ...(modOn('lots') ? pieceLots(p.path).map(x => 'Lote ' + x[0]) : [])].filter(Boolean).join(' · ');
      return h('button', {class: 'comp', type: 'button', style: 'width:100%;text-align:left;align-items:center', onclick: () => openPiece(p.path)},
        h('div', {class: 'tx'}, h('span', {class: 'nm'}, display(p.key)), h('small', null, p.path.slice(0, -1).join(' › ') + (extra ? ' · ' + extra : ''))),
        h('div', {class: 'have', style: `color:var(--${p.qty === 0 ? 'danger' : 'good'});font-size:15px`}, fmt(p.qty)));
    }) : [h('div', {class: 'hint', style: 'padding:14px 0'}, 'Nenhuma peça com estes filtros.')]));
    if (list.length > 300) box.append(h('div', {class: 'hint', style: 'padding:10px 0'}, `A mostrar 300 de ${fmt(list.length)}. Afine os filtros.`));
  }
  renderList();
  main.replaceChildren(h('h2', {class: 'ptitle'}, 'Overview'),
    q, h('div', {class: 'fgrid'}, sel('Pasta', 'main', mains), sel('Tag', 'tag', S.tags.library, modOn('tags')), sel('Etiqueta', 'label', Object.keys(S.labels.library).sort(cmp), modOn('labels')),
      sel('Lote', 'lot', Object.keys(g.lots).sort(cmp), modOn('lots')), sel('Kit', 'kit', kitNames(), modOn('kits')), sort),
    zero, info, box,
    h('button', {class: 'btn gray block', type: 'button', onclick: () => exportCsv(ovFilter())}, svg(ICON.download, 18), 'Exportar esta lista (CSV)'));
}

function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
function exportCsv(list) {
  const rows = [['Pasta', 'Peça', 'Quantidade', 'Tag', 'Etiquetas', 'Lotes', 'Kits']];
  const pcs = list || allPieces().sort((a, b) => cmp(a.path.join('/'), b.path.join('/')));
  for (const p of pcs) rows.push([p.path.slice(0, -1).join(' > '), display(p.key), p.qty, tagOf(p.path) || '', labelChipTexts(p.path).join('; '),
    pieceLots(p.path).map(x => x[0] + ': ' + x[1]).join('; '), kitsUsingPiece(pkey(p.path)).map(x => x[0] + ' ×' + x[1]).join('; ')]);
  download('inventario.csv', '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast(`Exportado: ${rows.length - 1} peça${rows.length === 2 ? '' : 's'} em CSV (abre no Excel).`);
}
function backupAll() {
  const d = {gest_backup: 1, app: 'Gest', criado: nowStr(), dados: {inv: S.inv, base: S.base, tags: S.tags, labels: S.labels, lots: S.lots, kits: S.kits, log: S.log, meta: S.meta,
    baseLots: S.baseLots, baseKits: S.baseKits, baseTags: S.baseTags, baseLabels: S.baseLabels}};
  download(`gest_backup_${nowStr().slice(0, 10)}.json`, JSON.stringify(d));
  toast('Backup completo guardado. Guarde o ficheiro num sítio seguro.');
}
async function restoreBackup(d) {
  const x = d.dados || {};
  if (!validInv(x.inv)) { toast('Este backup não parece válido.'); return; }
  const ok = await ask({title: 'Restaurar o backup?', danger: true, ok: 'Restaurar',
    text: `Tudo o que está neste telemóvel (inventário, tags, etiquetas, lotes, receitas e histórico) é substituído pelo backup de ${d.criado || 'data desconhecida'}.`});
  if (!ok) return;
  const cl = o => JSON.parse(JSON.stringify(o));
  S.inv = x.inv; S.base = isFolder(x.base) ? x.base : cl(x.inv);
  S.tags = x.tags && Array.isArray(x.tags.library) ? x.tags : {library: [], assignments: {}};
  S.labels = x.labels && x.labels.library ? x.labels : {library: {}, assignments: {}};
  S.lots = x.lots || {}; S.kits = x.kits || {}; S.log = Array.isArray(x.log) ? x.log : []; S.meta = x.meta || {importedAt: null, exportedLen: 0};
  S.baseLots = x.baseLots || cl(S.lots); S.baseKits = x.baseKits || cl(S.kits); S.baseTags = x.baseTags || cl(S.tags); S.baseLabels = x.baseLabels || cl(S.labels);
  S.path = []; S.view = 'folders'; S.tagFilter = S.labelFilter = S.lotFilter = S.kit = null; S.edit = null; kitIdx = null; lastChange = null;
  save(K.base, S.base); save(K.meta, S.meta); save(K.baselots, S.baseLots); save(K.basekits, S.baseKits); save(K.basetags, S.baseTags); save(K.baselabels, S.baseLabels); saveAll();
  toast('Backup restaurado.'); render(); window.scrollTo(0, 0);
}

/* barra de baixo: os quatro sítios mais usados; "Explorar" abre o menu lateral (pastas, tags, etiquetas e lotes) */
async function tabGo(id) { if (id === 'explore') { openDrawer(); return; } navTo(id === 'home' ? {view: 'folders'} : {view: id}); }
function renderTabs() {
  const box = document.getElementById('tabs'), ind = document.getElementById('ind');
  if (!S.inv) { box.replaceChildren(); ind.hidden = true; return; }
  const items = [['home', 'Início', 'home'], ['explore', 'Explorar', 'folder'], ...(modOn('kits') ? [['kits', 'Kits', 'kit']] : []), ['changes', 'Histórico', 'history']];
  const active = S.query.trim() ? null : S.view === 'changes' ? 'changes' : S.view === 'kits' ? 'kits' : (S.view === 'folders' && !S.path.length) ? 'home' : 'explore';
  box.replaceChildren(...items.map(([id, label, icon]) => {
    const b = h('button', {class: 'tab', type: 'button', 'aria-current': active === id ? 'page' : null, onclick: () => tabGo(id)}, svg(ICON[icon], 22), label);
    if (id === 'changes' && pending() > 0) b.append(h('span', {class: 'pill'}, pending()));
    return b;
  }));
  const idx = items.findIndex(x => x[0] === active);
  ind.hidden = false; ind.style.width = (100 / items.length) + '%'; ind.style.opacity = idx < 0 ? '0' : '1'; if (idx >= 0) ind.style.setProperty('--i', idx);
}
function clearSearch(doRender = true) {
  S.query = ''; const q = document.getElementById('q'); q.value = ''; document.getElementById('q-clear').hidden = true;
  if (doRender) render();
}
/* quanto tempo passou desde a importação do inventario.json (texto curto para o topo) */
function importadoHa() {
  if (!S.meta.importedAt) return '';
  const t = new Date(S.meta.importedAt);
  if (isNaN(t)) return '';
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dia = new Date(t); dia.setHours(0, 0, 0, 0);
  const dias = Math.round((hoje - dia) / 86400000);
  const quanto = dias <= 0 ? 'hoje' : dias === 1 ? 'há 1 dia' : `há ${dias} dias`;
  return `importado ${quanto} (${t.toLocaleDateString('pt-PT')})`;
}
function render(keepScroll) {
  const y = window.scrollY;
  enterAnim = !keepScroll;
  if (S.sel && !(selectable() && S.sel.path === pkey(S.path))) S.sel = null;   // a seleção acaba ao sair da pasta
  renderSel();
  document.getElementById('fab').hidden = !(S.inv && S.view === 'folders' && S.path.length > 0 && !S.query.trim() && !S.edit);
  document.body.classList.toggle('onb', !S.inv);
  renderTabs();
  if (drawerEl) renderDrawer();
  const sub = document.getElementById('subtitle');
  if (!S.inv) { sub.textContent = 'Inventário'; viewWelcome(); return; }
  const st = stats(S.inv);
  const quando = importadoHa();
  sub.textContent = `${st.pieces} peças · ${st.units} un.` + (quando ? ` · ${quando}` : '');
  if (S.query.trim()) viewSearch();
  else if (S.view === 'tags') viewTags();
  else if (S.view === 'kits') viewKits();
  else if (S.view === 'overview') viewOverview();
  else if (S.view === 'labels') viewLabels();
  else if (S.view === 'lots') viewLots();
  else if (S.view === 'changes') viewChanges();
  else viewFolders();
  if (keepScroll) window.scrollTo(0, y);
  else { main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter'); }
}

/* ---------- eventos ---------- */
let qTimer = null;
document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value;
  document.getElementById('q-clear').hidden = !v;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.query = v; render(); }, 120);
});
document.getElementById('q-clear').addEventListener('click', () => { clearSearch(); document.getElementById('q').focus(); });
document.getElementById('btn-menu').addEventListener('click', openMenu);
document.getElementById('fab').addEventListener('click', () => flowNewPiece(S.path.slice()));
document.getElementById('file').addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  if (files.length) importFiles(files);
});

render();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
